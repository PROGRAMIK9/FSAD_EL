# Judge0 CE: the sandbox that compiles and runs student code (isolate + cgroups).
# Runs on its own VM, never on the app host. See README.md in this folder.
x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: 50m
      max-file: "3"

services:
  server:
    image: judge0/judge0:1.13.1
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    ports:
      - "2358:2358"
    privileged: true
    restart: always
    <<: *logging

  workers:
    image: judge0/judge0:1.13.1
    command: ["./scripts/workers"]
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    privileged: true
    restart: always
    <<: *logging

  db:
    image: postgres:16.2
    env_file: judge0.conf
    volumes:
      - data:/var/lib/postgresql/data/
    restart: always
    <<: *logging

  redis:
    image: redis:7.2.4
    command: ["bash", "-c", 'docker-entrypoint.sh --appendonly no --requirepass "$$REDIS_PASSWORD"']
    env_file: judge0.conf
    restart: always
    <<: *logging

volumes:
  data:
